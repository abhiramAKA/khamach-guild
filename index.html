<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>КХАМАЧ — Чертоги Ордена</title>
    <script>
        window.GUILD_VERSION = "v2.4.0-BETA";
        (function() {
            const buster = Date.now() + '_' + Math.floor(Math.random() * 999999);
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'guild-styles.css?v=' + window.GUILD_VERSION + '&t=' + buster;
            document.head.appendChild(link);

            const scripts = [
                'guild-data.js',
                'guild-core.js',
                'guild-equip-slots.js',
                'guild-equip.js',
                'guild-equip-actions.js',
                'guild-bag.js',
                'guild-ship-audio.js',
                'guild-ship-ctrl.js',
                'guild-ship-loot.js',
                'guild-ship-render.js',
                'guild-ship-game.js'
            ];
            function loadSeq(idx) {
                if (idx >= scripts.length) {
                    if (typeof initGuildModule === 'function') initGuildModule();
                    return;
                }
                const s = document.createElement('script');
                s.src = scripts[idx] + '?v=' + window.GUILD_VERSION + '&t=' + buster;
                s.async = false;
                s.onload = function() { loadSeq(idx + 1); };
                s.onerror = function() {
                    const ft = document.getElementById('guild-version-footer');
                    if (ft) ft.innerText = 'Ошибка файла: ' + scripts[idx] + ' | ' + window.GUILD_VERSION;
                };
                document.head.appendChild(s);
            }
            document.addEventListener('DOMContentLoaded', function() {
                const ft = document.getElementById('guild-version-footer');
                if (ft) ft.innerText = 'Орден Кхамача | Сборка ' + window.GUILD_VERSION;
                loadSeq(0);
            });
        })();
    </script>
</head>
<body>
    <div id="guild-app">
        <div id="guild-main-screen" class="guild-window">
            <div class="guild-header">
                <button id="back-to-hub-btn" class="mini-btn back-tint" title="Вернуться в Цитадель">↩️ Хаб</button>
                <h1>ОРДЕН КХАМАЧА</h1>
                <span id="guild-lvl-badge" class="mini-btn gold-text">👑 1</span>
            </div>
            <span class="subtitle">Астральный Предел Абхирамбурга</span>

            <div id="guild-resources-bar" class="res-bar">
                <button class="menu-btn" style="padding:7px; font-size:12px;" onclick="openGuildView('bag')">🎒 Открыть Рюкзак и Склад</button>
            </div>

            <div class="guild-grid">
                <button class="tile-btn" onclick="openGuildView('pet')">
                    <span class="tile-icon">🐉</span>
                    <span class="tile-label">Питомец</span>
                </button>
                <button class="tile-btn" onclick="openGuildView('ship')">
                    <span class="tile-icon">🚀</span>
                    <span class="tile-label">Корабль</span>
                </button>
                <button class="tile-btn" style="opacity:0.62;" onclick="openGuildView('skills')">
                    <span class="tile-icon">🌳</span>
                    <span class="tile-label">Древо Навыков</span>
                </button>
                <button class="tile-btn" style="opacity:0.62;" onclick="openGuildView('altar')">
                    <span class="tile-icon">⛩️</span>
                    <span class="tile-label">Алтарь</span>
                </button>
                <button class="tile-btn" style="opacity:0.62;" onclick="openGuildView('farm')">
                    <span class="tile-icon">🌾</span>
                    <span class="tile-label">Ферма</span>
                </button>
                <button class="tile-btn" style="opacity:0.62;" onclick="openGuildView('shop')">
                    <span class="tile-icon">🏪</span>
                    <span class="tile-label">Магазин</span>
                </button>
            </div>
            <div id="guild-version-footer" class="version-footer">Орден Кхамача | Сборка v2.3.0-BETA</div>
        </div>

        <div id="guild-sub-screen" class="guild-window" style="display: none;">
            <h2 id="sub-view-title">Раздел</h2>
            <span id="sub-view-subtitle" class="subtitle">Описание</span>
            <div id="sub-view-body" class="sub-body"></div>
            <button id="sub-view-back-btn" class="menu-btn back-tint" onclick="closeGuildView()">Назад в Орден</button>
        </div>
    </div>
</body>
</html>
